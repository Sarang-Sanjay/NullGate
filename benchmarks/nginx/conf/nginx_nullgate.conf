# NullGate Macro-benchmark: Nginx Compartmentalized Configuration
worker_processes 1;
daemon off;
pid /tmp/nginx_nullgate.pid;
error_log /tmp/nginx_nullgate_error.log notice;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;

    server {
        listen 8081 default_server;
        server_name localhost;

        location / {
            default_type text/plain;
            return 200 "OK - NullGate Compartmentalized\n";
        }

        location /plaintext {
            default_type text/plain;
            return 200 "NullGate high-throughput compartmentalization test payload.\n";
        }
    }
}
